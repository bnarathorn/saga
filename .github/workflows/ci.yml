name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run already in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Two databases in the one service container: the e2e stack empties its database before the
  # API starts, which would wipe fixtures out from under the integration and API suites.
  SAGA_TEST_DATABASE_URL: postgres://saga:saga@127.0.0.1:5432/saga_test
  SAGA_E2E_DATABASE_URL: postgres://saga:saga@127.0.0.1:5432/saga_e2e

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: saga
          POSTGRES_PASSWORD: saga
          POSTGRES_DB: saga
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saga -d saga"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Pinned rather than read from `engines`, which is a range: CI must be deterministic.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The compose stack does this from an initdb script, which a service container cannot
      # mount. Extensions are created by migration 0001; only the databases are needed here.
      - name: Create the test databases
        run: |
          for db in saga_test saga_e2e; do
            psql "postgres://saga:saga@127.0.0.1:5432/postgres" \
              -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
          done
        env:
          PGPASSWORD: saga

      # Both of these guard a failure the rest of CI cannot see, so they run before the slow
      # jobs. The `image` job does catch an over-broad .dockerignore, but only after a full
      # `docker build`, and only for tracked paths — a gitignored path wrongly left in the
      # context is invisible to CI entirely, because a fresh checkout does not have one.
      - name: Check .dockerignore against .gitignore
        run: pnpm check:ignores

      # SAGA_E2E_DATABASE_URL was undocumented for as long as it existed, hidden by the
      # workflow-level env: block below. Only a local setup ever hit it.
      - name: Check .env.example documents every configuration variable
        run: pnpm check:env

      - run: pnpm lint

      # Formatting is not style-policing: it drifted once already, when subagent-written files
      # landed unformatted and nothing caught it. `eslint-config-prettier` (eslint.config.js)
      # means ESLint and Prettier do not fight over the same lines.
      - run: pnpm format:check

      - run: pnpm typecheck

      # Spec 22.3: generated artifacts must never drift from the Zod contracts they come from.
      - name: Check generated OpenAPI is current
        run: pnpm openapi:check

      - run: pnpm test

      # A separate step, not `test:all`: the integration and api projects truncate shared
      # tables, so they must not run concurrently with each other.
      - run: pnpm test:web

      - run: pnpm build

      - run: pnpm test:integration

      - run: pnpm test:api

      # Chromium only — the browser suite pins one project, so the other engines are dead
      # weight in the cache and the download.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  # The Compose stack is what README leads with, and until this job existed nothing built it —
  # not CI, not any local run. Every defect in it reached users unchallenged. No database and no
  # suites here: this asks only whether the images build and whether what they contain is right.
  image:
    name: docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Fetch depth 1 is enough: the build reads HEAD's sha and commit time, nothing older.
      - uses: actions/checkout@v7

      - name: Build the API and worker image
        run: docker build -f deploy/docker/Dockerfile -t saga-api:ci .

      - name: Build the Guild Hall image
        run: docker build -f deploy/docker/Dockerfile.web -t saga-web:ci .

      # The executable served at /api/cli/saga must name the commit it was built from. It
      # stamped `0.1.0+local.<wall clock>` for as long as the build stage had no git installed:
      # a version naming no commit, differing on every rebuild of an unchanged tree, and not
      # the `0.1.0+g<sha>` README step 6 tells the user to check for.
      - name: The image serves a CLI built from this commit
        run: |
          expected="g$(git rev-parse --short=10 HEAD)"
          actual=$(docker run --rm saga-api:ci node apps/cli/pack/dist/saga --version)
          printf 'expected: 0.1.0+%s.<timestamp>\ngot:      %s\n' "$expected" "$actual"
          case "$actual" in
            # `.dirty` means git saw modified tracked files inside the build stage, which on a
            # clean CI checkout can only mean the context is missing a tracked path — the exact
            # failure a careless .dockerignore entry causes.
            *.dirty.*)
              echo "::error::the image's CLI is stamped dirty ('$actual') — a tracked path is missing from the build context; check .dockerignore against .gitignore"
              exit 1 ;;
            "0.1.0+$expected".*) ;;
            *)
              echo "::error::the image serves a CLI stamped '$actual', not one built from $expected"
              exit 1 ;;
          esac

      # `.env` holds a real session secret and a real bootstrap password by the time anyone runs
      # `docker compose up --build` (README step 2). A canary proves `.dockerignore` keeps it
      # out. When it does, the build context is unchanged and this step is a pure cache hit.
      - name: No .env reaches the build stage
        run: |
          printf 'SAGA_SESSION_SECRET=canary-must-not-be-in-the-image\n' > .env
          docker build -f deploy/docker/Dockerfile --target build -t saga-build:ci .
          if docker run --rm saga-build:ci test -f /app/.env; then
            echo "::error::.env reached the build stage — check .dockerignore"
            exit 1
          fi
