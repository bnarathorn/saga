<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Guild Hall — the web console for Saga: project memory, work continuity and agent coordination."
    />
    <title>Guild Hall — Saga</title>
    <!-- Applied before first paint so a reload never flashes the wrong theme. A separate file
         rather than inline script: the reference deployment's CSP has no `script-src`, so
         `default-src 'self'` blocks inline script and the theme was lost on every reload. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Guild Hall requires JavaScript. The Saga API remains usable without it.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
