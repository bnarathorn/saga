# Guild Hall + Saga API behind one TLS origin.
#
#   /            static Guild Hall build (served even when the API is down)
#   /api/        Fastify API
#   /health/     liveness and readiness probes
#   /api/events/ Server-Sent Events (buffering disabled)
#
# Same-origin by default: no CORS configuration is required for the console.
#
# Install both files — the header snippet is included below, and `include` resolves against
# nginx's prefix:
#
#   sudo cp deploy/nginx/guild-hall.conf /etc/nginx/sites-available/
#   sudo cp deploy/nginx/saga-headers.conf /etc/nginx/
#
# Three values are placeholders, not settings:
#
#   server_name             the host in SAGA_PUBLIC_URL
#   ssl_certificate[_key]   a real certificate for that host
#   root                    wherever apps/web/dist was copied to
#
# nginx -t fails until the certificate exists, and that is deliberate. A production deployment
# sets SAGA_COOKIE_SECURE=true, so the session and CSRF cookies are marked Secure and a browser
# will not send them back over a plaintext origin: serving this without TLS produces a console
# nobody can sign in to, which is a much slower thing to diagnose than a missing file.

upstream saga_api {
    server 127.0.0.1:4319;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name saga.example.internal;

    return 301 https://$host$request_uri;
}

server {
    # nginx 1.25.1 and later prefer `listen 443 ssl;` with a separate `http2 on;`. The form below
    # is deprecated there but still accepted, and it is the only one older builds understand.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name saga.example.internal;

    ssl_certificate     /etc/letsencrypt/live/saga.example.internal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saga.example.internal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SagaSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Where `rsync -a --delete apps/web/dist/ …` puts the build. Debian and Ubuntu keep nginx's
    # document root under /var/www; other distributions use /usr/share/nginx/html.
    root /var/www/saga-app;
    index index.html;

    # Uploads and request bodies are bounded here as well as in the API.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; index.html must never be cached, or a deploy would keep
    # serving a stale application shell against a new API.
    location /assets/ {
        include saga-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include saga-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # The theme bootstrap carries no content hash, so `location /` would leave it to heuristic
    # caching and a browser could keep an old copy across deploys. `no-cache` still allows a 304.
    location = /theme.js {
        include saga-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include saga-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://saga_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /health/ {
        proxy_pass http://saga_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # Server-Sent Events: buffering and gzip must be off or events arrive in batches.
    location /api/events/ {
        proxy_pass http://saga_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }
}
