# Response headers for Guild Hall's static files.
#
# This exists as a snippet because nginx's add_header does not merge: a block that declares one
# add_header discards every header inherited from the blocks above it. Repeating the whole set in
# every location that adds a header of its own is the only way to keep them, and doing that by
# hand is how an application shell ends up served with no Content-Security-Policy.
#
# Copy this file next to guild-hall.conf — `include` below resolves against nginx's prefix,
# normally /etc/nginx:
#
#   sudo cp deploy/nginx/saga-headers.conf /etc/nginx/
#
# Deliberately not included in the proxied locations: @fastify/helmet sets its own headers there,
# and a response carrying both X-Frame-Options: DENY and helmet's SAMEORIGIN is worse than one
# carrying either.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

# HSTS is deliberately absent. Add it — `add_header Strict-Transport-Security "max-age=31536000"
# always;` — only once Saga owns the whole hostname on 443. HSTS is scoped to the host, not the
# port (RFC 6797 §8.1), so serving it from a Saga deployment on a non-standard port pins every
# other service on that hostname to HTTPS as well: a sibling site still on plain :80 then becomes
# unreachable in any browser that has loaded the console, and stays that way for max-age.
