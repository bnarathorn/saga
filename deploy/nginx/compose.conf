# Guild Hall + Saga API inside Compose, on one plain-HTTP origin.
#
# guild-hall.conf is the deployment config: TLS, a certificate for a real hostname, and an API on
# 127.0.0.1 because nginx and the service share a host. None of that is true in a container — the
# API is another service on the Compose network, there is no certificate, and TLS terminates
# wherever the operator puts it. Baking that file into the image produced an nginx that could not
# start at all, so the two are kept apart deliberately.
#
# The location blocks below are otherwise the same as guild-hall.conf's, and saga-headers.conf is
# shared between them, so a header added for one deployment is added for both.

upstream saga_api {
    server api:4319;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; index.html must never be cached, or a deploy would keep
    # serving a stale application shell against a new API.
    location /assets/ {
        include saga-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include saga-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        include saga-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://saga_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /health/ {
        proxy_pass http://saga_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # Server-Sent Events: buffering and gzip must be off or events arrive in batches.
    location /api/events/ {
        proxy_pass http://saga_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }
}
